<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` lets the artwork reach the edges of the screen.
         Without it iOS insets the whole page by the safe areas and the picture
         comes up with a black band above and below it. What has to stay clear
         of the notch is the controls, and they hold their own inset. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="An interactive kaleidoscope: mirrored, animated shards rendered on canvas."
    />
    <title>Kaleidoscope</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Kaleidoscope needs JavaScript to render its canvas.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
